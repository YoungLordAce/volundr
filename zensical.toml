[project]
site_name = "Völundr"
site_description = "Automatic ROM Forge — Cross-platform ROM ingestion pipeline for Windows, Linux, and Docker."
site_url = "https://younglordace.github.io/volundr/"
repo_url = "https://github.com/YoungLordAce/volundr"
repo_name = "YoungLordAce/volundr"
copyright = "Copyright &copy; 2026 Völundr Contributors — GNU GPLv3"

nav = [
    { "Home" = "index.md" },
    { "Getting Started" = "getting-started.md" },
    { "Desktop GUI" = "desktop-gui.md" },
    { "Tools & Keys" = "tools-and-keys.md" },
    { "Supported Consoles" = "consoles.md" },
    { "Docker & NAS" = "docker-nas.md" },
    { "Configuration" = "configuration.md" },
    { "Architecture" = "architecture.md" },
    { "Changelog" = "changelog.md" },
]

[project.theme]
variant = "modern"
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.sections",
    "navigation.top",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
